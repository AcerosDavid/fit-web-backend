# Override para desarrollo: recarga en caliente + volumen de código.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "True"
    volumes:
      - .:/app
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

  db:
    ports:
      - "${DB_HOST_PORT:-5434}:5432"

  # Solo en desarrollo: interfaz web para gestionar la base de datos.
  adminer:
    image: adminer:6.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy
