components:
  schemas:
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        member:
          type: integer
        check_in:
          type: string
          format: date-time
          readOnly: true
        check_out:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        registered_by:
          type: integer
          readOnly: true
          nullable: true
        member_details:
          allOf:
          - $ref: '#/components/schemas/Member'
          readOnly: true
      required:
      - check_in
      - check_out
      - id
      - member
      - member_details
      - registered_by
    BlankEnum:
      enum:
      - ''
    CheckIn:
      type: object
      properties:
        member_id:
          type: integer
      required:
      - member_id
    Coach:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        specialty:
          type: string
          description: 'Ej: Pesas, Crossfit, Zumba'
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        bio:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
          description: Usuario de sistema asociado (opcional)
      required:
      - created_at
      - first_name
      - id
      - last_name
      - specialty
      - updated_at
    CustomTokenObtainPair:
      type: object
      description: |-
        Extends the default JWT login response to include user info.
        Instead of returning only { access, refresh },
        returns: { access, refresh, user: { id, username, role, ... } }
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    DashboardStats:
      type: object
      description: Métricas agregadas de GET /api/dashboard/.
      properties:
        active_members:
          type: integer
        monthly_revenue:
          type: number
          format: double
        todays_attendance:
          type: integer
        expiring_memberships:
          type: integer
        month:
          type: string
      required:
      - active_members
      - expiring_memberships
      - month
      - monthly_revenue
      - todays_attendance
    DetailMessage:
      type: object
      description: 'Respuesta genérica: {"detail": "..."}'
      properties:
        detail:
          type: string
      required:
      - detail
    ErrorMessage:
      type: object
      description: 'Respuesta de error: {"error": "..."} (+ attendance_id opcional).'
      properties:
        error:
          type: string
        attendance_id:
          type: integer
      required:
      - error
    GenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      type: string
      description: |-
        * `MALE` - Male
        * `FEMALE` - Female
        * `OTHER` - Other
    LoginResponse:
      type: object
      description: Respuesta de POST /api/auth/login/.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Member:
      type: object
      description: Serializer for reading member data.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        status:
          $ref: '#/components/schemas/MemberStatusEnum'
        is_deleted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - full_name
      - id
      - is_deleted
      - last_name
      - updated_at
    MemberCreateUpdate:
      type: object
      description: Serializer for creating and updating members.
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        status:
          $ref: '#/components/schemas/MemberStatusEnum'
      required:
      - email
      - first_name
      - last_name
    MemberStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `SUSPENDED` - Suspended
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        member:
          type: integer
        plan:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          readOnly: true
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
        is_valid:
          type: boolean
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        member_details:
          allOf:
          - $ref: '#/components/schemas/Member'
          readOnly: true
        plan_details:
          allOf:
          - $ref: '#/components/schemas/Plan'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - end_date
      - id
      - is_valid
      - member
      - member_details
      - plan
      - plan_details
      - updated_at
    MembershipStatusEnum:
      enum:
      - ACTIVE
      - EXPIRED
      - CANCELLED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `EXPIRED` - Expired
        * `CANCELLED` - Cancelled
    MethodEnum:
      enum:
      - CASH
      - CARD
      - TRANSFER
      type: string
      description: |-
        * `CASH` - Efectivo
        * `CARD` - Tarjeta
        * `TRANSFER` - Transferencia
    PatchedCoach:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        specialty:
          type: string
          description: 'Ej: Pesas, Crossfit, Zumba'
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        bio:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
          description: Usuario de sistema asociado (opcional)
    PatchedMemberCreateUpdate:
      type: object
      description: Serializer for creating and updating members.
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        status:
          $ref: '#/components/schemas/MemberStatusEnum'
    PatchedMembership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        member:
          type: integer
        plan:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          readOnly: true
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
        is_valid:
          type: boolean
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        member_details:
          allOf:
          - $ref: '#/components/schemas/Member'
          readOnly: true
        plan_details:
          allOf:
          - $ref: '#/components/schemas/Plan'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        membership:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_date:
          type: string
          format: date-time
        method:
          $ref: '#/components/schemas/MethodEnum'
        notes:
          type: string
        received_by:
          type: integer
          readOnly: true
          nullable: true
        membership_details:
          allOf:
          - $ref: '#/components/schemas/Membership'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPlan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Duration of the plan in days
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUser:
      type: object
      description: Serializer for reading user data. Never exposes the password.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
    Payment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        membership:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_date:
          type: string
          format: date-time
        method:
          $ref: '#/components/schemas/MethodEnum'
        notes:
          type: string
        received_by:
          type: integer
          readOnly: true
          nullable: true
        membership_details:
          allOf:
          - $ref: '#/components/schemas/Membership'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - membership
      - membership_details
      - received_by
      - updated_at
    Plan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Duration of the plan in days
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - duration_days
      - id
      - name
      - price
      - updated_at
    RefreshResponse:
      type: object
      description: Respuesta de POST /api/auth/refresh/ (ROTATE_REFRESH_TOKENS=True).
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    RegisterUser:
      type: object
      description: Serializer for creating new users (admin only).
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - password
      - username
    RoleEnum:
      enum:
      - ADMIN
      - RECEPTIONIST
      - COACH
      type: string
      description: |-
        * `ADMIN` - Administrador
        * `RECEPTIONIST` - Recepcionista
        * `COACH` - Entrenador
    User:
      type: object
      description: Serializer for reading user data. Never exposes the password.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Login JWT, refresh y perfil del usuario
- name: users
  description: Gestión del staff (admins y recepcionistas)
