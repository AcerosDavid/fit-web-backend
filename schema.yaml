openapi: 3.0.3
info:
  title: Fit Web API
  version: 1.0.0
  description: 'API RESTful de gestión de gimnasio: autenticación JWT, clientes, planes,
    membresías, pagos, asistencia (check-in/check-out), coaches y dashboard. Autentícate
    en `POST /api/auth/login/` y usa el token en el header `Authorization: Bearer
    <token>`.'
paths:
  /api/attendance/:
    get:
      operationId: attendance_list
      description: Historial de check-in/check-out, filtrable por cliente y fecha.
      summary: Listar asistencias
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Filtra por fecha de check-in (YYYY-MM-DD)
      - in: query
        name: member
        schema:
          type: integer
        description: Filtra por ID de cliente
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
          description: ''
  /api/attendance/{id}/check-out/:
    post:
      operationId: attendance_check_out_create
      description: Cierra la asistencia activa del cliente. Devuelve 404 si no hay
        asistencia abierta.
      summary: Registrar check-out
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
  /api/attendance/check-in/:
    post:
      operationId: attendance_check_in_create
      description: Registra la entrada de un cliente al gimnasio. Devuelve 404 si
        el cliente no existe o está inactivo, y 400 si ya tiene una asistencia abierta
        (incluye attendance_id).
      summary: Registrar check-in
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Autentica con username/password y devuelve los tokens JWT más
        el perfil del usuario. Usa `access` en `Authorization: Bearer <token>`.'
      summary: Iniciar sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET devuelve los datos del usuario autenticado; PUT/PATCH los actualizan
        (sin password).
      summary: Obtener/actualizar el perfil propio
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: GET devuelve los datos del usuario autenticado; PUT/PATCH los actualizan
        (sin password).
      summary: Obtener/actualizar el perfil propio
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: GET devuelve los datos del usuario autenticado; PUT/PATCH los actualizan
        (sin password).
      summary: Obtener/actualizar el perfil propio
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Intercambia un `refresh` válido por un nuevo par `access` + `refresh`
        (ROTATE_REFRESH_TOKENS=True).
      summary: Refrescar tokens
      tags:
      - auth
      requestBody:
        content:
          refresh:
            schema:
              type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/coaches/:
    get:
      operationId: coaches_list
      description: GET lista los entrenadores activos; POST crea uno.
      summary: Listar o crear entrenadores
      tags:
      - coaches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coach'
          description: ''
    post:
      operationId: coaches_create
      description: GET lista los entrenadores activos; POST crea uno.
      summary: Listar o crear entrenadores
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coach'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Coach'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Coach'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
          description: ''
  /api/coaches/{id}/:
    get:
      operationId: coaches_retrieve
      description: DELETE hace soft-delete (is_active=False) para conservar el historial.
      summary: Detalle/actualizar/eliminar un entrenador
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - coaches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
          description: ''
    put:
      operationId: coaches_update
      description: DELETE hace soft-delete (is_active=False) para conservar el historial.
      summary: Detalle/actualizar/eliminar un entrenador
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coach'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Coach'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Coach'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
          description: ''
    patch:
      operationId: coaches_partial_update
      description: DELETE hace soft-delete (is_active=False) para conservar el historial.
      summary: Detalle/actualizar/eliminar un entrenador
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - coaches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCoach'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCoach'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCoach'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
          description: ''
    delete:
      operationId: coaches_destroy
      description: DELETE hace soft-delete (is_active=False) para conservar el historial.
      summary: Detalle/actualizar/eliminar un entrenador
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - coaches
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: 'Agrega en tiempo real: clientes activos, ingresos del mes, asistencias
        de hoy, membresías que vencen en 7 días y el mes de referencia.'
      summary: Métricas del panel de administración
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: 'Devuelve `{"status": "ok"}` si la API y la base de datos responden.
        No requiere autenticación.'
      summary: Estado del servicio
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/members/:
    get:
      operationId: members_list
      description: GET devuelve solo los clientes activos (excluye los soft-deletados).
        POST crea un cliente.
      summary: Listar o crear clientes
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
    post:
      operationId: members_create
      description: GET devuelve solo los clientes activos (excluye los soft-deletados).
        POST crea un cliente.
      summary: Listar o crear clientes
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberCreateUpdate'
          description: ''
  /api/members/{id}/:
    get:
      operationId: members_retrieve
      description: GET devuelve el cliente; PUT/PATCH actualizan (serializer de creación/edición).
      summary: Detalle/actualizar un cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    put:
      operationId: members_update
      description: GET devuelve el cliente; PUT/PATCH actualizan (serializer de creación/edición).
      summary: Detalle/actualizar un cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberCreateUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberCreateUpdate'
          description: ''
    patch:
      operationId: members_partial_update
      description: GET devuelve el cliente; PUT/PATCH actualizan (serializer de creación/edición).
      summary: Detalle/actualizar un cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberCreateUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberCreateUpdate'
          description: ''
  /api/members/{id}/delete/:
    delete:
      operationId: members_delete_destroy
      description: Marca el cliente como eliminado (deleted_at) sin borrar su historial
        contable.
      summary: Soft-delete de un cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: ''
  /api/members/{id}/restore/:
    post:
      operationId: members_restore_create
      description: Revierte el soft-delete. Devuelve 400 si el cliente no estaba eliminado.
      summary: Restaurar un cliente eliminado
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - members
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: ''
  /api/memberships/:
    get:
      operationId: memberships_list
      description: GET lista membresías; POST asigna un plan a un cliente (calcula
        end_date automáticamente).
      summary: Listar o asignar membresías
      parameters:
      - in: query
        name: member
        schema:
          type: integer
        description: Filtra membresías por ID de cliente
      tags:
      - memberships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
          description: ''
    post:
      operationId: memberships_create
      description: GET lista membresías; POST asigna un plan a un cliente (calcula
        end_date automáticamente).
      summary: Listar o asignar membresías
      parameters:
      - in: query
        name: member
        schema:
          type: integer
        description: Filtra membresías por ID de cliente
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Membership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Membership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Membership'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/memberships/{id}/:
    get:
      operationId: memberships_retrieve
      description: GET devuelve la membresía; PUT/PATCH permite cambiar el estado
        (ej. CANCELLED).
      summary: Detalle/actualizar una membresía
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - memberships
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    put:
      operationId: memberships_update
      description: GET devuelve la membresía; PUT/PATCH permite cambiar el estado
        (ej. CANCELLED).
      summary: Detalle/actualizar una membresía
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Membership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Membership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Membership'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
    patch:
      operationId: memberships_partial_update
      description: GET devuelve la membresía; PUT/PATCH permite cambiar el estado
        (ej. CANCELLED).
      summary: Detalle/actualizar una membresía
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMembership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembership'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/payments/:
    get:
      operationId: payments_list
      description: GET lista cobros; POST registra un cobro (efectivo, tarjeta o transferencia).
      summary: Listar o registrar pagos
      parameters:
      - in: query
        name: member
        schema:
          type: integer
        description: Filtra pagos por ID de cliente
      - in: query
        name: membership
        schema:
          type: integer
        description: Filtra pagos por ID de membresía
      tags:
      - payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
          description: ''
    post:
      operationId: payments_create
      description: GET lista cobros; POST registra un cobro (efectivo, tarjeta o transferencia).
      summary: Listar o registrar pagos
      parameters:
      - in: query
        name: member
        schema:
          type: integer
        description: Filtra pagos por ID de cliente
      - in: query
        name: membership
        schema:
          type: integer
        description: Filtra pagos por ID de membresía
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Payment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Payment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{id}/:
    get:
      operationId: payments_retrieve
      description: GET devuelve el pago; PUT/PATCH permite corregir datos (ej. notas).
      summary: Detalle/actualizar un pago
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    put:
      operationId: payments_update
      description: GET devuelve el pago; PUT/PATCH permite corregir datos (ej. notas).
      summary: Detalle/actualizar un pago
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Payment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Payment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    patch:
      operationId: payments_partial_update
      description: GET devuelve el pago; PUT/PATCH permite corregir datos (ej. notas).
      summary: Detalle/actualizar un pago
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/plans/:
    get:
      operationId: plans_list
      description: 'GET: admin o recepción. POST: solo admin.'
      summary: Listar o crear planes
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
    post:
      operationId: plans_create
      description: 'GET: admin o recepción. POST: solo admin.'
      summary: Listar o crear planes
      tags:
      - plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Plan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Plan'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/plans/{id}/:
    get:
      operationId: plans_retrieve
      description: 'GET: admin o recepción. PUT/PATCH/DELETE: solo admin.'
