# La base de datos se configura con DATABASE_URL (Neon u otro proveedor).
# Render pedirá el valor al crear el Blueprint (sync: false).
services:
  - type: web
    name: fit-web-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
    initialDeployHook: sh seed.sh
